services:
  soc-watch:
    build:
      context: .
      dockerfile: deploy/home-server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SOC_WATCH_HOST: 0.0.0.0
      SOC_WATCH_PORT: '8080'
      SOC_WATCH_DATA_DIR: /app/state
      SOC_WATCH_PUBLIC_ORIGIN: https://laptop-1.tail029be8.ts.net
      SOC_WATCH_SERVER_AGENT: 'true'
      SOC_WATCH_DATA_SOURCE: browser_relay
      APP_STATE_DIR: /app/state
      SOC_WATCH_ENV_FILE: /app/.env
    volumes:
    - /home/semi/app-deploy/state/soc-watch:/app/state
    - /home/semi/app-deploy/backups/gitops/soc-watch:/backups
    - /home/semi/app-deploy/env/soc-watch.env:/app/.env:ro
    networks:
    - learning
    stop_grace_period: 180s
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8080/api/agent/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    image: home-server/soc-watch:gitops
    pull_policy: build
    container_name: home-apps-soc-watch-1
networks:
  learning:
    external: true
    name: nginx-learning_default
